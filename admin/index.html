<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Shopeiz Admin</title>
<link rel="icon" href="/assets/brand/shopeiz-logo.png">
<style>
@font-face{font-family:'Work Sans';src:url('/assets/fonts/WorkSans.woff') format('woff');font-weight:300 700;font-display:swap}
@font-face{font-family:'Rupee';src:url('/assets/fonts/Archivo-latin-ext.woff2') format('woff2');unicode-range:U+20B9}
:root{--ink:#070707;--ink2:#3a3a3a;--muted:#6B6B6B;--line:#E4E4E4;--bg:#F6F6F5;--wine:#6D001A;--wine2:#5B0014;--tint:#F2E6E6;--ok:#1F7A3D;--okbg:#E5F3EA;--warn:#8A5A00;--warnbg:#FBF0D9;--bad:#A3122A;--badbg:#FBE5E8;--blue:#1D4F91;--bluebg:#E3ECF8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'Work Sans',system-ui,sans-serif}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wm{display:inline-flex;align-items:center;background:var(--wine);color:#fff;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;font-size:18px}
/* layout */
.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .brand{display:flex;align-items:center;gap:8px;margin:0 6px 22px}
aside .brand small{color:var(--muted);font-size:12px}
aside a.nav{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:6px;text-decoration:none;color:var(--ink2);font-weight:600}
aside a.nav:hover{background:var(--bg)}
aside a.nav.on{background:var(--tint);color:var(--wine)}
aside .pill{background:var(--wine);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
aside .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 6px}
main{padding:26px 30px 80px;min-width:0}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi b{display:block;font-size:24px;margin:2px 0}
.kpi span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi small{color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#bbb}
.btn.pri{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.pri:hover{background:var(--wine2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;min-width:0}
textarea.in{width:100%;min-height:70px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button i{font-style:normal;opacity:.6;margin-left:4px}
table{width:100%;border-collapse:collapse;background:#fff}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFAFA}
.tbl{border:1px solid var(--line);border-radius:10px;overflow:auto;background:#fff}
.num{text-align:right;font-variant-numeric:tabular-nums}
.st{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.st.new{background:var(--warnbg);color:var(--warn)}
.st.confirmed{background:var(--bluebg);color:var(--blue)}
.st.placed{background:#EEE7F8;color:#5B3A99}
.st.shipped{background:#E1F2F4;color:#0E6470}
.st.delivered{background:var(--okbg);color:var(--ok)}
.st.cancelled{background:#EEE;color:#555}
.st.rto,.st.failed{background:var(--badbg);color:var(--bad)}
.st.replaced{background:var(--tint);color:var(--wine)}
.st.paid{background:var(--okbg);color:var(--ok)}
.st.pending{background:#F1F1F1;color:#555}
.st.refunded{background:#EEE;color:#555}
.thumb{width:40px;height:40px;object-fit:contain;background:#F3F3F2;border-radius:6px;flex:0 0 40px}
.muted{color:var(--muted)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:50;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:#fff;z-index:51;overflow:auto;transform:translateX(100%);transition:transform .25s;box-shadow:-10px 0 30px rgba(0,0,0,.1)}
.drawer.on{transform:none}
.drawer .hd{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;align-items:center;gap:10px;z-index:2}
.drawer .bd{padding:20px 22px 60px}
.sec{margin:0 0 22px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.flow{display:flex;gap:6px;flex-wrap:wrap}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .meta{font-size:12px;color:var(--muted)}
.ev{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.f{display:grid;gap:4px}
.f label{font-size:12px;color:var(--muted);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(380px,100%);padding:30px}
.login form{display:grid;gap:12px;margin-top:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px}
.bars div{flex:1;background:var(--wine);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div:hover{background:var(--ink)}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:3px 6px;border-radius:4px;white-space:nowrap;margin-bottom:4px}
.bar-x{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
.hbar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--wine)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.mtop{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:250px;z-index:40;transform:translateX(-100%);transition:.25s}
  aside.on{transform:none}
  .mtop{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  main{padding:18px 14px 80px}
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .k2,.fgrid{grid-template-columns:1fr}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script src="/assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
