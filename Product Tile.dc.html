<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/shopeiz-design-system-fece2216-ec80-4013-86dd-cc38d5cda3d7/styles.css">
  <script src="_ds/shopeiz-design-system-fece2216-ec80-4013-86dd-cc38d5cda3d7/_ds_bundle.js"></script>
</helmet>
<article style="display: flex; flex-direction: column; background: var(--white); box-shadow: inset 0 0 0 1px #EFE3D8; font-family: var(--font-sans); min-width: 0; height: 100%; outline: 1px solid transparent; outline-offset: -1px; transition: outline-color 220ms cubic-bezier(.2,0,0,1), transform 320ms cubic-bezier(.2,0,0,1), box-shadow 320ms cubic-bezier(.2,0,0,1);" style-hover="outline-color: var(--burgundy-500); transform: translateY(-3px); box-shadow: 0 14px 30px rgba(109,0,26,0.12);">
  <div onClick="{{ p.onOpen }}" style="position: relative; aspect-ratio: 269 / 168; background: #FBEEE4; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer;">
    <sc-if value="{{ p.img }}" hint-placeholder-val="{{ false }}">
      <img src="{{ p.img }}" alt="{{ p.title }}" style="width: 100%; height: 100%; object-fit: contain; transition: transform 600ms cubic-bezier(.2,0,0,1);" style-hover="transform: scale(1.06);"></img>
    </sc-if>
    <sc-if value="{{ p.noImg }}" hint-placeholder-val="{{ true }}">
      <x-import component-from-global-scope="ShopeizDesignSystem_fece22.Icon" name="{{ p.icon }}" size="56" stroke-width="1.75" color="var(--black)" hint-size="56px,56px"></x-import>
    </sc-if>
    <sc-if value="{{ p.tag }}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; top: 10px; left: 10px;">
        <x-import component-from-global-scope="ShopeizDesignSystem_fece22.Tag" tone="deal" size="sm" hint-size="48px,20px">{{ p.tag }}</x-import>
      </span>
    </sc-if>
    <span style="position: absolute; top: 6px; right: 6px;">
      <x-import component-from-global-scope="ShopeizDesignSystem_fece22.IconButton" icon="heart" label="Save to wishlist" size="36" variant="solid" active="{{ p.wished }}" on-click="{{ p.onWishStop }}" hint-size="36px,36px"></x-import>
    </span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; flex: 1;">
    <span style="font-size: 11px; letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-accent);">{{ p.category }}</span>
    <h3 onClick="{{ p.onOpen }}" style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.3; color: var(--text-strong); cursor: pointer; text-underline-offset: 3px;" style-hover="text-decoration: underline;">{{ p.title }}</h3>
    <sc-if value="{{ p.was }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 11px; letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-accent); margin-bottom: -4px;">Offer price</span>
    </sc-if>
    <x-import component-from-global-scope="ShopeizDesignSystem_fece22.Price" amount="{{ p.price }}" was="{{ p.was }}" currency="INR" size="md" hint-size="160px,26px"></x-import>
    <sc-if value="{{ p.was }}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 12px; font-weight: 600; color: var(--text-accent);">{{ p.saveLine }}</span>
    </sc-if>
    <span style="font-size: 12px; color: var(--text-secondary);">{{ p.delivery }}</span>
    <div style="margin-top: auto; padding-top: 12px;">
      <x-import component-from-global-scope="ShopeizDesignSystem_fece22.Button" full-width="{{ true }}" size="sm" on-click="{{ p.onAdd }}" hint-size="100%,36px">Add to cart</x-import>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:440},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
