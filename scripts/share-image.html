<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Corm;src:url(CormorantGaramond[wght].ttf);font-weight:300 700}
@font-face{font-family:Corm;src:url(CormorantGaramond-Italic[wght].ttf);font-style:italic;font-weight:300 700}
@font-face{font-family:Archivo;src:url(Archivo-latin.woff2);font-weight:400 800}
@font-face{font-family:BSD;src:url(BigShouldersDisplay-latin.woff2);font-weight:900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Archivo;-webkit-font-smoothing:antialiased}
.c{display:grid;grid-template-columns:720px 480px;height:630px}
.ink{background:#0a0a0a;color:#fff;padding:54px 60px 46px;display:flex;flex-direction:column;justify-content:space-between}
.wm{display:inline-flex;align-items:center;background:#6D001A;color:#fff;font-family:BSD;font-weight:900;font-size:46px;line-height:1;letter-spacing:.005em;padding:.06em .14em .02em;height:1.04em;box-sizing:content-box}
.top{display:flex;align-items:center;justify-content:space-between}
.url{font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:#9a9a9a}
h1{font-family:Corm;font-weight:500;font-size:92px;line-height:.98;letter-spacing:-.015em;margin:0 0 22px}
h1 em{font-style:italic;color:#D1A8A8}
.lead{font-size:23px;color:#c9c9c9;line-height:1.45;max-width:560px}
.facts{display:flex;gap:26px;border-top:1px solid #2c2c2c;padding-top:22px;font-size:17px;color:#e6e6e6;letter-spacing:.01em}
.facts span{display:flex;align-items:center;gap:10px}
.facts i{width:7px;height:7px;background:#6D001A;display:inline-block;outline:1px solid #D1A8A8}
.acc{background:#6D001A;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.acc svg.big{width:230px;margin-top:-50px;fill:#fff;position:relative;z-index:2}
.acc svg.ghost{position:absolute;width:560px;right:-200px;bottom:-170px;fill:rgba(255,255,255,.06)}
.tag{position:absolute;left:44px;bottom:42px;right:44px;color:#F2E6E6;font-family:Corm;font-style:italic;font-size:34px;line-height:1;z-index:2;display:flex;flex-direction:column;gap:12px;border-top:1px solid rgba(255,255,255,.25);padding-top:20px}
.tag small{font-family:Archivo;font-style:normal;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:#E5CDCD}
</style></head><body><div class="c">
<div class="ink">
  <div class="top"><span class="wm">SHOPEIZ</span><span class="url">shopeiz.com</span></div>
  <div><h1>The art of having <em>everything.</em></h1><p class="lead">Anything you need, in one place, at your door. Kitchen, home, electronics, beauty and more.</p></div>
  <div class="facts"><span><i></i>Free delivery over ₹499</span><span><i></i>Cash on delivery</span><span><i></i>7-day replacement</span></div>
</div>
<div class="acc">
  <svg class="big" viewBox="0 0 206.04 235.47"><path fill-rule="evenodd" d="M44.15 0L161.89 0L206.04 44.15L206.04 235.47L0 235.47L0 44.15ZM95.66 22.07h14.72v14.72h-14.72ZM29.44 58.87L176.61 58.87L176.61 88.3L58.87 88.3L58.87 117.74L176.61 117.74L176.61 206.04L29.44 206.04L29.44 176.6L147.17 176.6L147.17 147.17L29.44 147.17L29.44 58.87Z"/></svg>
  <div class="tag"><span>Everything, fairly priced.</span><small>Delivered across India</small></div>
</div>
</div></body></html>
